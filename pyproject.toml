[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdprompt"
version = "0.1.0"
description = "GFM and TeX documents with explicit AI instruction regions"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
mdprompt = "mdprompt.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
mdprompt = ["*.txt"]
